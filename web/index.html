<script>

 if(d.confirmId){ask={id:d.confirmId,text:d.lines[0]};msg=null;ok=true}else{ask=null;ok=!!d.ok;msg={ok,t:(d.lines||[]).join(" "),until:Date.now()+5000};if(ok&&/^notify (setup|show)/.test(text||""))info=d.lines;
  const m=/(task|habit|goal) (\d+)/.exec((d.lines||[])[0]||"");if(ok&&text&&m&&/^(add|habit add|goal) /.test(text)){const n=+m[2];if(m[1]=="task")selId=n;else if(m[1]=="habit")selHab=n;else selGoal=n}}}

function remForm(){return `<div class="rf"><input id="rt" placeholder="نص التذكير…" value="${esc(drafts.rt||"")}"><div class="rr"><input type="date" id="rd" value="${drafts.rd||""}"><input type="time" id="rtm" value="${drafts.rtm||""}"><button data-b="radd">إضافة تذكير</button></div><div class="rr"><small class="mu">سريع:</small><button data-b="rq" data-w="in 10m">بعد 10 دقائق</button><button data-b="rq" data-w="in 1h">بعد ساعة</button><button data-b="rq" data-w="tomorrow 09:00">غدًا 9:00</button></div></div>`}

document.addEventListener("change",e=>{const el=e.target;if(el.id=="nm"){localStorage.setItem("name",el.value.trim()||"عبود");redraw()}if(el.id=="ps"){persona=el.value;localStorage.setItem("persona",persona);redraw()}});

 else if(b=="hday")cmd(`habit ${d.on=="1"?"uncheck":"check"} ${id} ${d.d}`)

 else if(b=="hnote")cmd(`habit note ${id} ${$("hn").value.trim()}`).then(()=>{drafts.hn=undefined})

 else if(b=="gdel")cmd(`delete goal ${id}`)

async function poll(){try{S=await (await fetch("/api/state")).json();offline=false;const A=S.activity||[],k=A.length?A[A.length-1].time+A[A.length-1].action:"";
 if(seenKey!==null&&k!==seenKey){const i=A.findIndex(a=>a.time+a.action===seenKey),f=i<0?A:A.slice(i+1),r=f.filter(a=>a.action=="reminder.fire").pop();

<script>
const anzuState = () => fetch("/api/state").then(r => r.json());
AnzuUI.init({
  root: "#home-view",
  sidebar: false,
  navigate: ["chat", "settings"],
  data: {
    tasks: () => anzuState().then(s => s.tasks.map(t => ({ title: t.title, done: t.done, due: t.due ? t.due + "T" + (t.dueTime || "00:00") : null }))),
    habits: () => anzuState().then(s => { const T = ymd(new Date()); return (s.habits || []).map(h => ({ title: h.title, streak: hst(h).streak, doneToday: h.days.includes(T) })); }),
    goals: () => anzuState().then(s => s.goals.map(g => { const k = s.tasks.filter(t => t.goalId === g.id); return { title: g.title, progress: k.length ? Math.round(100 * k.filter(t => t.done).length / k.length) : 0 }; }))
  },
  onNavigate: (w) => go(w === "chat" ? "anzu" : w),
  onUnknown: (text) => { go("anzu"); chatSend(text); }
